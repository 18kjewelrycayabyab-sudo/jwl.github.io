<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DNA Mismatch Repair — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="extra.css">
</head>
<body class="extra-page">

  <div class="blob blob-pink" aria-hidden="true"></div>
  <div class="blob blob-blue" aria-hidden="true"></div>

  <header class="extra-top">
    <a class="logo" href="../dna.html">DNA <span>MMR</span></a>
    <p class="extra-count" id="navProgress" aria-live="polite">Preview</p>
    <button type="button" class="menu-btn" id="menuBtn">All scenes</button>
  </header>

  <aside class="viewer-dock" id="viewerDock" aria-label="3D model for the current scene">
    <div class="dna-card">
      <div class="dna-stage">
        <div class="dna" id="extraDNA"></div>
      </div>
      <p class="animation-caption" id="viewerCaption">A rotating DNA double helix</p>
      <div class="animation-controls">
        <button type="button" class="control-btn" id="pauseBtn">Pause</button>
        <button type="button" class="control-btn" id="replayBtn">Replay</button>
      </div>
    </div>
  </aside>

  <main id="story" class="snap-root"></main>

  <div class="scene-overlay hidden" id="sceneOverlay">
    <div class="scene-sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <p class="eyebrow">Simulation contents</p>
      <h2 id="menuTitle">Choose a scene</h2>
      <div id="sceneList" class="scene-list"></div>
      <button type="button" class="secondary-btn" id="closeMenu">Close</button>
    </div>
  </div>

  <div class="extra-dock">
    <div class="progress-track" aria-hidden="true">
      <div id="progressBar"></div>
    </div>
    <div class="navigation">
      <button type="button" class="secondary-btn" id="prevBtn">← Previous</button>
      <button type="button" class="primary-btn" id="nextBtn">Next scene →</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
  <script src="../dna.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollToPlugin.min.js"></script>
  <script src="extra.js"></script>
</body>
</html>
